<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 bg-white flex flex-col">
   <!-- HEADER -->
    <div class="bg-black text-white p-8">
        <div class="grid grid-cols-2 gap-4 justify-between">
            <div>
                <h1 class="text-2xl font-semibold">National</h1>
                <p class="text-xs text-white leading-loose">
                    Individual KYC Report
                </p>
            </div>
            
            <div class="justify-end flex mt-6">
                <div class="flex flex-col gap-2">
                    <div>
                        <p class="text-sm font-medium">LOGO HERE</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="p-2 bg-[#2563EB]"></div>
    <!-- BODY TABLE -->
     <div class="text-white py-4 px-8 items-center justify-center mb-2">
        <div class="grid md:grid-cols-2 grid-cols-1 gap-4 justify-between px-14 flex mt-10">
            <div class="">
                <label class="block mb-2 text-sm font-medium text-gray-900">Match Parameter</label>
                <input type="text" placeholder="70" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-extralight">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900">Remarks</label>
                <input type="text" placeholder="Enter Remarks" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-extralight">
            </div>

            <div class="mt-28">
                <label class="block mb-2 text-sm font-medium text-gray-900">Signature</label>
            </div>
        </div>
     </div>
     <!-- SIGNATURE -->
     <div class="grid md:grid-cols-2 grid-cols-1 px-8 pt-2 pb-4">
        <div>
            <p class="font-medium text-xs">Date of Extraction: <span class="font-light">6/24/2024 6:21:33 PM</span></p>
        </div>
        <div class="flex justify-end text-xs font-light">
            <p>Computer generated report, hence no signature is required.</p>
        </div>

     </div>
     <!-- SIGNATURE ENDING -->
    <div class="p-2 bg-black"></div>

    <div class="bg-[#2563EB] text-white p-6"></div>
</body>
</html>
